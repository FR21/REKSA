name: Deploy AI to Cloud Run

on:
  push:
    branches:
      - master
      - main
      - ui
    paths:
      - 'AI/**'
      - '.github/workflows/deploy-ai.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy AI Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy AI Service to Cloud Run
        run: |
          gcloud run deploy reksa-ai \
            --source AI \
            --region asia-southeast2 \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --cpu-throttling \
            --set-env-vars="REKSA_FORECAST_MODEL=/app/models/near_miss_forecaster.joblib,REKSA_PRIORITY_MODEL=/app/models/priority_engine.joblib,REKSA_ANOMALY_MODEL=/app/models/operational_anomaly_detector.joblib"
