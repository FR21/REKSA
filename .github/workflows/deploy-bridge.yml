name: Deploy Bridge to Cloud Run

on:
  push:
    branches:
      - master
    paths:
      - 'bridge/**'
      - '.github/workflows/deploy-bridge.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Bridge to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          cat << 'EOF' > env.yaml
          GOOGLE_CLOUD_PROJECT: "$GCP_PROJECT_ID"
          PUBSUB_TOPIC: "reksa-telemetry"
          MQTT_HOST: "7f6f4329c068430fbdbaa80c8eff1265.s1.eu.hivemq.cloud"
          MQTT_PORT: "8883"
          MQTT_USERNAME: "reksa-backend"
          MQTT_PASSWORD: "Terbukalahiot23_"
          BRIDGE_ID: "reksa-cloud-bridge-01"
          OUTBOX_PATH: "/tmp/outbox.db"
          EOF
          sed -i "s|\$GCP_PROJECT_ID|${GCP_PROJECT_ID}|g" env.yaml

          gcloud run deploy reksa-bridge \
            --source bridge \
            --region asia-southeast2 \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 1 \
            --no-cpu-throttling \
            --env-vars-file env.yaml

