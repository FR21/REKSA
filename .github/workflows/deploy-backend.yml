name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          AI_URL=$(gcloud run services describe reksa-ai --region asia-southeast2 --format='value(status.url)' 2>/dev/null || echo "")
          
          gcloud run deploy reksa-backend \
            --source backend \
            --region asia-southeast2 \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --update-env-vars "APP_ENV=production,AI_SERVICE_URL=${AI_URL},CORS_ORIGINS=https://reksa-k3.web.app,https://${GCP_PROJECT_ID}.web.app,http://localhost:5173"
