name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Cloud Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          WIT_AI_TOKEN: ${{ secrets.WIT_AI_TOKEN || '' }}
        run: |
          cat << 'EOF' > env.yaml
          APP_ENV: "production"
          MQTT_ENABLED: "false"
          DATABASE_URL: "$DATABASE_URL"
          WIT_AI_TOKEN: "$WIT_AI_TOKEN"
          CORS_ORIGINS: "https://reksa-k3.web.app,https://$GCP_PROJECT_ID.web.app,http://localhost:5173"
          EOF
          sed -i "s|\$DATABASE_URL|${DATABASE_URL}|g" env.yaml
          sed -i "s|\$GCP_PROJECT_ID|${GCP_PROJECT_ID}|g" env.yaml
          sed -i "s|\$WIT_AI_TOKEN|${WIT_AI_TOKEN}|g" env.yaml

          gcloud run deploy reksa-backend \
            --source backend \
            --region asia-southeast2 \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --env-vars-file env.yaml
