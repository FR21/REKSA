name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Cloud Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          WIT_AI_TOKEN: ${{ secrets.WIT_AI_TOKEN || '' }}
        run: |
          AI_URL=$(gcloud run services describe reksa-ai --region asia-southeast2 --format='value(status.url)' 2>/dev/null || echo "")

          python3 -c "
          import os
          data = {
              'APP_ENV': 'production',
              'AI_SERVICE_URL': os.environ.get('AI_URL', ''),
              'DATABASE_URL': os.environ.get('DATABASE_URL', ''),
              'WIT_AI_TOKEN': os.environ.get('WIT_AI_TOKEN', ''),
              'CORS_ORIGINS': f\"https://reksa-k3.web.app,https://{os.environ.get('GCP_PROJECT_ID', '')}.web.app,http://localhost:5173\",
          }
          with open('env.yaml', 'w') as f:
              for k, v in data.items():
                  if v:
                      escaped = str(v).replace('\\\\', '\\\\\\\\').replace('\"', '\\\\\"')
                      f.write(f'{k}: \"{escaped}\"\n')
          "

          gcloud run deploy reksa-backend \
            --source backend \
            --region asia-southeast2 \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --env-vars-file env.yaml
